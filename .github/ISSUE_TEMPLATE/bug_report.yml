name: Bug report
description: Report a problem with RenForge
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in the fields below so the issue can be reproduced. Don't share game content you aren't allowed to redistribute.
  - type: input
    id: version
    attributes:
      label: RenForge version
      placeholder: "e.g. 1.2.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "e.g. Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game
      description: Name of the visual novel / game you were working with.
    validations:
      required: false
  - type: input
    id: renpy
    attributes:
      label: Ren'Py engine version (if known)
      description: Often found in the game's renpy/ folder or in the logs.
    validations:
      required: false
  - type: dropdown
    id: stage
    attributes:
      label: At which stage does it happen?
      options:
        - Extraction
        - Translation / editor
        - Media (images / audio)
        - Build / delivery
        - Export (full game / mod)
        - Source viewer
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste any error text or attach screenshots.
    validations:
      required: false
